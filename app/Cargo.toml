[package]
name = "pocketdeck-pc"
description = "PocketDeck for PC: stream your PC games to PocketDeck from anywhere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "PocketDeck"
path = "src/main.rs"

[dependencies]
pocketdeck-core = { path = "../crates/core" }
pocketdeck-display = { path = "../crates/display" }
pocketdeck-library = { version = "0.1.0", path = "../crates/library" }
pocketdeck-sunshine = { path = "../crates/sunshine" }
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
slint = { version = "1.16.1", features = ["raw-window-handle-06"] }
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Media", "Win32_Media_Audio", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
slint-build = "1.16.1"
winresource = "0.1.34"
