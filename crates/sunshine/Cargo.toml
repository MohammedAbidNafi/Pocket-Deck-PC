[package]
name = "pocketdeck-sunshine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["json", "rustls"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory"] }
winreg = "0.56.0"
