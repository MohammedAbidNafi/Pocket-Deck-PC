<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 80 80" width="320" height="320" role="img" aria-label="PocketDeck logo">
  <!-- PocketDeck logo, identical to the Android app (docs/logo.svg there). -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="18" y1="12" x2="80" y2="104">
      <stop offset="0" stop-color="#2A1488"/><stop offset="0.5" stop-color="#0C0926"/><stop offset="1" stop-color="#15127A"/>
    </linearGradient>
    <radialGradient id="bgCentre" gradientUnits="userSpaceOnUse" cx="54" cy="54" r="38">
      <stop offset="0" stop-color="#070618" stop-opacity="0.9"/><stop offset="1" stop-color="#070618" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" gradientUnits="userSpaceOnUse" cx="54" cy="92" r="24">
      <stop offset="0" stop-color="#3A3BFF" stop-opacity="0.7"/><stop offset="1" stop-color="#3A3BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGlow" gradientUnits="userSpaceOnUse" x1="54" y1="30" x2="54" y2="78">
      <stop offset="0" stop-color="#B84DFF"/><stop offset="0.5" stop-color="#6A5CFF"/><stop offset="1" stop-color="#4DB0FF"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="54" y1="31" x2="54" y2="77">
      <stop offset="0" stop-color="#B84DFF"/><stop offset="0.5" stop-color="#6A5CFF"/><stop offset="1" stop-color="#4DB0FF"/>
    </linearGradient>
    <linearGradient id="grip" gradientUnits="userSpaceOnUse" x1="54" y1="42.5" x2="54" y2="65">
      <stop offset="0" stop-color="#F7F3FF"/><stop offset="1" stop-color="#B4A0FF"/>
    </linearGradient>
    <linearGradient id="droid" gradientUnits="userSpaceOnUse" x1="54" y1="49.2" x2="54" y2="56.5">
      <stop offset="0" stop-color="#B892FF"/><stop offset="1" stop-color="#6C5CFF"/>
    </linearGradient>
    <clipPath id="ringCut"><path d="M0,0 H108 V41.3 H0 Z M0,65.8 H108 V108 H0 Z"/></clipPath>
    <clipPath id="iconShape"><rect x="14" y="14" width="80" height="80" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#iconShape)">
    <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>
    <rect x="0" y="0" width="108" height="108" fill="url(#bgCentre)"/>
    <rect x="0" y="0" width="108" height="108" fill="url(#bgGlow)"/>
  </g>

  <!-- Ring, hidden where the grips cross it -->
  <g clip-path="url(#ringCut)" fill="none">
    <path d="M54,32.65 a21.35,21.35 0 1,1 0,42.7 a21.35,21.35 0 1,1 0,-42.7 Z" stroke="url(#ringGlow)" stroke-width="6.5" stroke-opacity="0.22"/>
    <path d="M54,32.65 a21.35,21.35 0 1,1 0,42.7 a21.35,21.35 0 1,1 0,-42.7 Z" stroke="url(#ring)" stroke-width="3.1"/>
  </g>

  <!-- Left grip + D-pad -->
  <path fill="url(#grip)" d="M39.3,43.6 L35.6,43.1 C31.3,42.7 29.1,44.7 27.8,47.2 L25.0,54 C23.5,58.3 24.4,63.9 29.1,64.7 C30.6,64.9 31.9,64.5 33.1,64.0 L39.4,61.3 Z"/>
  <path fill="#0B0820" d="M28.9,49.65 H35.5 A0.8,0.8 0 0 1 36.3,50.45 V51.75 A0.8,0.8 0 0 1 35.5,52.55 H28.9 A0.8,0.8 0 0 1 28.1,51.75 V50.45 A0.8,0.8 0 0 1 28.9,49.65 Z M31.55,47 H32.85 A0.8,0.8 0 0 1 33.65,47.8 V54.4 A0.8,0.8 0 0 1 32.85,55.2 H31.55 A0.8,0.8 0 0 1 30.75,54.4 V47.8 A0.8,0.8 0 0 1 31.55,47 Z"/>

  <!-- Right grip + face buttons -->
  <path fill="url(#grip)" d="M68.7,43.6 L72.4,43.1 C76.7,42.7 78.9,44.7 80.2,47.2 L83.0,54 C84.5,58.3 83.6,63.9 78.9,64.7 C77.4,64.9 76.1,64.5 74.9,64.0 L68.6,61.3 Z"/>
  <path fill="#0B0820" d="M74.4,49.2 a1.5,1.5 0 1,0 3,0 a1.5,1.5 0 1,0 -3,0 Z M74.4,54.8 a1.5,1.5 0 1,0 3,0 a1.5,1.5 0 1,0 -3,0 Z M71.6,52 a1.5,1.5 0 1,0 3,0 a1.5,1.5 0 1,0 -3,0 Z M77.2,52 a1.5,1.5 0 1,0 3,0 a1.5,1.5 0 1,0 -3,0 Z"/>

  <!-- Phone -->
  <path fill="#0B0820" d="M42,42.7 H66 A5.1,5.1 0 0 1 71.1,47.8 V57 A5.1,5.1 0 0 1 66,62.1 H42 A5.1,5.1 0 0 1 36.9,57 V47.8 A5.1,5.1 0 0 1 42,42.7 Z"/>
  <path fill="#0D0A22" stroke="#F3EEFF" stroke-width="1.1" d="M42.05,44.55 H65.95 A3.3,3.3 0 0 1 69.25,47.85 V56.95 A3.3,3.3 0 0 1 65.95,60.25 H42.05 A3.3,3.3 0 0 1 38.75,56.95 V47.85 A3.3,3.3 0 0 1 42.05,44.55 Z"/>
  <path fill="none" stroke="#F3EEFF" stroke-width="0.9" d="M42.6,46.1 H65.4 A2.3,2.3 0 0 1 67.7,48.4 V56.4 A2.3,2.3 0 0 1 65.4,58.7 H42.6 A2.3,2.3 0 0 1 40.3,56.4 V48.4 A2.3,2.3 0 0 1 42.6,46.1 Z"/>
  <path fill="#8C6BFF" d="M42.3,50.4 a0.45,0.45 0 0 1 0.45,0.45 v3 a0.45,0.45 0 0 1 -0.9,0 v-3 a0.45,0.45 0 0 1 0.45,-0.45 Z"/>

  <!-- Android robot head (CC BY 3.0, Google) -->
  <path fill="none" stroke="#A684FF" stroke-width="0.6" stroke-linecap="round" d="M50.4,51.0 L49.2,49.0 M57.6,51.0 L58.8,49.0"/>
  <path fill="url(#droid)" d="M46.75,56.5 A7.25,7.25 0 0 1 61.25,56.5 Z"/>
  <path fill="#0D0A22" d="M50.4,53.9 a0.7,0.7 0 1,0 1.4,0 a0.7,0.7 0 1,0 -1.4,0 Z M56.2,53.9 a0.7,0.7 0 1,0 1.4,0 a0.7,0.7 0 1,0 -1.4,0 Z"/>
</svg>
